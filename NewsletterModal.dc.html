// Timed pop-up settings
const POPUP_DELAY_MS = 15000;                       // 15 seconds after landing on the site
const POPUP_SNOOZE_MS = 7 * 24 * 60 * 60 * 1000;    // don't show again for 7 days after closing
const KEY_LANDED = 'mu_popup_landed_at';            // sessionStorage: when this visit started
const KEY_SEEN_THIS_VISIT = 'mu_popup_seen_visit';  // sessionStorage: modal already opened this visit
const KEY_DISMISSED = 'mu_popup_dismissed_at';      // localStorage: when the pop-up was last closed
const KEY_SUBSCRIBED = 'mu_popup_subscribed';       // localStorage: signed up, never auto-show again

const store = {
  get(area, k) { try { return window[area].getItem(k); } catch (e) { return null; } },
  set(area, k, v) { try { window[area].setItem(k, v); } catch (e) {} },
};

function isThanksPage() {
  let where = '';
  try { where = decodeURIComponent(location.pathname + location.search); } catch (e) { where = location.pathname + location.search; }
  if (/thanks/i.test(where)) return true;
  if (/^\s*thank you/i.test(document.title || '')) return true;
  return false;
}

function autoPopupAllowed() {
  if (isThanksPage()) return false;
  if (store.get('localStorage', KEY_SUBSCRIBED)) return false;
  if (store.get('sessionStorage', KEY_SEEN_THIS_VISIT)) return false;
  const dismissedAt = Number(store.get('localStorage', KEY_DISMISSED) || 0);
  if (dismissedAt && Date.now() - dismissedAt < POPUP_SNOOZE_MS) return false;
  return true;
}

class Component extends DCLogic {
  state = { open: false, mode: 'manual' };

  formRef = React.createRef();

  ensureGlobalAssets() {
    if (window.__brevoAssetsLoaded) return;
    window.__brevoAssetsLoaded = true;

    const style = document.createElement('style');
    style.id = 'brevo-global-style';
    style.textContent = GLOBAL_STYLE;
    document.head.appendChild(style);

    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://sibforms.com/forms/end-form/build/sib-styles.css';
    document.head.appendChild(link);

    window.REQUIRED_CODE_ERROR_MESSAGE = 'Please choose a country code';
    window.LOCALE = 'en';
    window.EMAIL_INVALID_MESSAGE = window.SMS_INVALID_MESSAGE = 'Please check your email address and try again.';
    window.REQUIRED_ERROR_MESSAGE = 'This is required.';
    window.GENERIC_INVALID_MESSAGE = 'Please check this and try again.';
    window.INVALID_NUMBER = 'The information provided is invalid. Please review the field format and try again.';
    window.INVALID_DATE = 'Please enter a valid date';
    window.REQUIRED_MULTISELECT_MESSAGE = 'Please select at least 1 option';
    window.translation = {
      common: {
        selectedList: '{quantity} list selected',
        selectedLists: '{quantity} lists selected',
        selectedOption: '{quantity} selected',
        selectedOptions: '{quantity} selected',
      }
    };
    window.AUTOHIDE = false;

    const mainScript = document.createElement('script');
    mainScript.defer = true;
    mainScript.src = 'https://sibforms.com/forms/end-form/build/main.js';
    document.body.appendChild(mainScript);

    const recaptchaScript = document.createElement('script');
    recaptchaScript.src = 'https://www.google.com/recaptcha/api.js?hl=en';
    document.body.appendChild(recaptchaScript);

    // Google's badge is injected async and can end up nested inside a
    // transformed/clipped ancestor, causing it to be cut off when the
    // modal overlay is open. Re-anchor it directly to <body> with an
    // explicit z-index above the modal (z-index:1000) whenever it appears.
    const fixBadge = (badge) => {
      if (badge.parentElement !== document.body) document.body.appendChild(badge);
      badge.style.setProperty('z-index', '2147483647', 'important');
      badge.style.setProperty('position', 'fixed', 'important');
      badge.style.setProperty('right', '0', 'important'); // keep "protected by reCAPTCHA" label expanded, not just on hover
    };
    const existing = document.querySelector('.grecaptcha-badge');
    if (existing) fixBadge(existing);
    const observer = new MutationObserver(() => {
      const badge = document.querySelector('.grecaptcha-badge');
      if (badge) fixBadge(badge);
    });
    observer.observe(document.body, { childList: true, subtree: true });
    window.__recaptchaBadgeObserver = observer;
  }

  closeBtnRef = React.createRef();
  dialogRef = React.createRef();

  // Every opening shows the same pop-up. mode only records how it opened:
  // 'manual' (sign-up buttons / ?subscribe) or 'auto' (15-second timer, which sets the 7-day snooze on close)
  show = (mode) => {
    this.ensureGlobalAssets();
    if (!this.props.preview) store.set('sessionStorage', KEY_SEEN_THIS_VISIT, '1');
    if (this.formRef.current) {
      this.formRef.current.classList.add('mu-promo');
      this.formRef.current.classList.remove('mu-done');
    }
    this.lastFocus = document.activeElement;
    this.setState({ open: true, mode }, () => {
      if (this.closeBtnRef.current) this.closeBtnRef.current.focus();
    });
  };

  open = () => this.show('manual');
  openAuto = () => { if (!this.state.open && autoPopupAllowed()) this.show('auto'); };

  startAutoTimer() {
    if (!autoPopupAllowed()) return;
    let landedAt = Number(store.get('sessionStorage', KEY_LANDED) || 0);
    if (!landedAt) { landedAt = Date.now(); store.set('sessionStorage', KEY_LANDED, String(landedAt)); }
    const wait = Math.max(0, POPUP_DELAY_MS - (Date.now() - landedAt));
    this.autoTimer = setTimeout(this.openAuto, wait);
  }

  watchForSuccess() {
    const host = this.formRef.current;
    if (!host || !window.MutationObserver) return;
    const shown = (el) => el && getComputedStyle(el).display !== 'none';
    const setText = (panel, text) => {
      const t = panel && panel.querySelector('.sib-form-message-panel__inner-text');
      if (t && t.textContent !== text) t.textContent = text;
    };
    this.successObserver = new MutationObserver(() => {
      const ok = host.querySelector('#success-message');
      const err = host.querySelector('#error-message');
      const promo = host.classList.contains('mu-promo');
      if (shown(ok)) {
        if (!this.props.preview) store.set('localStorage', KEY_SUBSCRIBED, '1');
        if (promo) {
          host.classList.add('mu-done');
          setText(ok, 'Almost there! Check your inbox and tap the confirmation link, and your checklist will follow.');
        }
      }
      if (shown(err) && promo) setText(err, 'Sorry, that didn\u2019t go through. Please try again.');
    });
    this.successObserver.observe(host, { attributes: true, childList: true, characterData: true, subtree: true, attributeFilter: ['style', 'class'] });
  }

  componentDidMount() {
    if (this.formRef.current) {
      this.formRef.current.innerHTML = FORM_HTML;
    }
    this.watchForSuccess();
    if (this.props.preview) {
      // Preview-only: show the timed pop-up straight away, without saving any "seen" or "closed" state
      window.__showPopupPreview = () => this.show('auto');
      setTimeout(() => this.show('auto'), 300);
    } else {
      this.startAutoTimer();
    }
    window.__openNewsletterModal = this.open;
    this.checkHash = () => {
      const h = location.hash.toLowerCase();
      const q = new URLSearchParams(location.search);
      if (h === '#subscribe' || q.has('subscribe')) this.open();
    };
    this.checkHash();
    window.addEventListener('hashchange', this.checkHash);
    this.handleKeyDown = (e) => {
      if (!this.state.open) return;
      if (e.key === 'Escape') { this.close(); return; }
      if (e.key === 'Tab') this.keepFocusInside(e);
    };
    document.addEventListener('keydown', this.handleKeyDown);
  }

  componentWillUnmount() {
    clearTimeout(this.autoTimer);
    if (this.successObserver) this.successObserver.disconnect();
    document.removeEventListener('keydown', this.handleKeyDown);
    window.removeEventListener('hashchange', this.checkHash);
    if (window.__openNewsletterModal) delete window.__openNewsletterModal;
  }

  // Keep keyboard focus inside the pop-up while it's open (Tab / Shift+Tab wrap around)
  keepFocusInside(e) {
    const dialog = this.dialogRef.current;
    if (!dialog) return;
    const items = Array.from(dialog.querySelectorAll(
      'a[href], button:not([disabled]), input:not([type="hidden"]):not([disabled]), select, textarea, iframe, [tabindex]:not([tabindex="-1"])'
    )).filter((el) => el.getClientRects().length > 0 && getComputedStyle(el).visibility !== 'hidden');
    if (!items.length) return;
    const first = items[0], last = items[items.length - 1];
    const active = document.activeElement;
    if (!dialog.contains(active)) { e.preventDefault(); first.focus(); return; }
    if (e.shiftKey && active === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && active === last) { e.preventDefault(); first.focus(); }
  }

  close = () => {
    if (this.state.mode === 'auto' && !this.props.preview) store.set('localStorage', KEY_DISMISSED, String(Date.now()));
    this.setState({ open: false });
    if (this.lastFocus && this.lastFocus.focus) { try { this.lastFocus.focus(); } catch (e) {} }
  };
  stopClick = (e) => e.stopPropagation();
  handleOverlayClick = () => this.close();

  renderVals() {
    return {
      overlayDisplay: this.state.open ? 'flex' : 'none',
      promoDisplay: 'block',
      dialogLabel: 'Free menopause symptom checklist sign-up',
      closeBtnRef: this.closeBtnRef,
      dialogRef: this.dialogRef,
      formHostRef: this.formRef,
      close: this.close,
      stopClick: this.stopClick,
      handleOverlayClick: this.handleOverlayClick,
    };
  }
}

</script>
</body>
</html>
